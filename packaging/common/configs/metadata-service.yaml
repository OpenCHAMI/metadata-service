---
################################################################################
# SPDX-FileCopyrightText: 2026 OpenCHAMI Contributors
# SPDX-License-Identifier: MIT
#
# metadata-service configuration. Mounted into the container at
# /etc/metadata-service/config.yaml.
#
# Precedence (highest first):
#   1. command-line flag
#   2. METADATA_SERVICE_<KEY> environment variable
#   3. bare environment alias, where one is listed below
#   4. this file
#   5. compiled-in default
#
# Environment variables therefore OVERRIDE this file. Set them in a systemd
# drop-in (in order of highest precedence):
#   /etc/containers/systemd/metadata-service.container.d/*.conf   (site, wins)
#   /usr/share/containers/systemd/metadata-service.container.d/*.conf  (packaged)
#   /etc/systemd/system/metadata-service.service.d/*.conf   (generated unit)
# Run `systemctl daemon-reload` after editing any of them.
################################################################################

################################################################################
# --- SERVER ---
################################################################################

# TCP port to listen on. (METADATA_SERVICE_PORT)
port: 8080

# Address to bind. 0.0.0.0 listens on all container interfaces.
# (METADATA_SERVICE_HOST)
host: '0.0.0.0'

# Request read timeout, seconds. (METADATA_SERVICE_READ_TIMEOUT)
#read_timeout: 15

# Response write timeout, seconds. (METADATA_SERVICE_WRITE_TIMEOUT)
#write_timeout: 15

# Keep-alive idle timeout, seconds. (METADATA_SERVICE_IDLE_TIMEOUT)
#idle_timeout: 60

################################################################################
# --- STORAGE ---
################################################################################
# Directory for the file storage backend. Must match the data volume mount in
# the unit; the compiled-in default (/data) is not writable by the container's
# nonroot user. (METADATA_SERVICE_DATA_DIR)
data_dir: '/app/data'

################################################################################
# --- SMD ---
################################################################################
# REQUIRED. Base URL of the State Management Database. The server exits at
# startup if this is unset and --mock-smd was not passed. Accepts a bare
# service URL (http://smd:27779) or a gateway-mounted path.
# (METADATA_SERVICE_SMD_URL, SMD_URL)
smd_url: 'http://smd:27779'

# Static bearer token for outbound SMD calls. Ignored when tokensmith_url is
# set. Prefer injecting as a secret over storing here.
# (METADATA_SERVICE_SMD_JWT, SMD_JWT)
#smd_jwt: ''

# Fallback static bearer token, used only when smd_jwt is empty.
# (METADATA_SERVICE_SMD_TOKEN, SMD_TOKEN)
#smd_token: ''

# Run the background worker that syncs the SMD inventory cache.
# (METADATA_SERVICE_SMD_SYNC_ENABLED)
smd_sync_enabled: true

# Interval between SMD cache syncs, seconds. (METADATA_SERVICE_SMD_SYNC_INTERVAL)
smd_sync_interval: 60

################################################################################
# --- TOKENSMITH ---
################################################################################
# Setting tokensmith_url switches SMD auth from a static token to dynamic
# token exchange; the server will not silently fall back to smd_jwt/smd_token.
# Cert + key select the mTLS path; the bootstrap token is the fallback path and
# is injected by the unit's Secret= directive, so do not set it here.

# TokenSmith base URL. Empty disables dynamic auth.
# (METADATA_SERVICE_TOKENSMITH_URL, TOKENSMITH_URL)
tokensmith_url: 'http://tokensmith:8080'

# Bootstrap token for the initial exchange.
# (METADATA_SERVICE_TOKENSMITH_BOOTSTRAP_TOKEN, TOKENSMITH_BOOTSTRAP_TOKEN)
#tokensmith_bootstrap_token: ''

# Client certificate PEM for mTLS service identity.
# (METADATA_SERVICE_TOKENSMITH_SERVICE_IDENTITY_CERT, TOKENSMITH_SERVICE_IDENTITY_CERT)
#tokensmith_service_identity_cert: ''

# Client key PEM for mTLS service identity.
# (METADATA_SERVICE_TOKENSMITH_SERVICE_IDENTITY_KEY, TOKENSMITH_SERVICE_IDENTITY_KEY)
#tokensmith_service_identity_key: ''

# Optional CA PEM overriding mTLS verification.
# (METADATA_SERVICE_TOKENSMITH_SERVICE_IDENTITY_CA, TOKENSMITH_SERVICE_IDENTITY_CA)
#tokensmith_service_identity_ca: ''

# Downstream service name requested in the token exchange.
# (METADATA_SERVICE_TOKENSMITH_TARGET_SERVICE, TOKENSMITH_TARGET_SERVICE)
tokensmith_target_service: 'smd'

# Comma-separated scope hint from the bootstrap token policy. Diagnostics and
# logging only; it does not grant scopes.
# (METADATA_SERVICE_TOKENSMITH_BOOTSTRAP_POLICY_SCOPES_HINT, TOKENSMITH_BOOTSTRAP_POLICY_SCOPES_HINT)
#tokensmith_bootstrap_policy_scopes_hint: ''

# Refresh the service token when its remaining lifetime drops below this many
# seconds. (METADATA_SERVICE_TOKENSMITH_REFRESH_SKEW_SEC, TOKENSMITH_REFRESH_SKEW_SEC)
#tokensmith_refresh_skew_sec: 300

################################################################################
# --- WIREGUARD ---
################################################################################
# Requires AddCapability=cap_net_admin and AddDevice=/dev/net/tun in the unit.

# Server address and CIDR of the WireGuard network, e.g. 100.97.0.1/16.
# Empty disables the userspace controller. There is no bare env alias.
# (METADATA_SERVICE_WIREGUARD_SERVER)
#wireguard_server: ''

# Path to the peer state file, persisted across restarts. Place it under
# data_dir to survive on the data volume. (METADATA_SERVICE_WIREGUARD_STATE_FILE)
#wireguard_state_file: '/app/data/wireguard/state.yaml'

# Reject requests that do not arrive over the WireGuard network. Has no effect
# unless wireguard_server is set. (METADATA_SERVICE_WIREGUARD_ONLY)
wireguard_only: false

################################################################################
# --- OBSERVABILITY ---
################################################################################

# Serve Prometheus metrics at /metrics. (METADATA_SERVICE_ENABLE_METRICS)
enable_metrics: true

# Port for the dedicated metrics listener, bound to `host`.
# (METADATA_SERVICE_METRICS_PORT)
metrics_port: 9090

# Verbose logging, plus /debug pprof endpoints. Do not enable in production.
# (METADATA_SERVICE_DEBUG)
debug: false

# --config and --mock-smd are flag-only: they have no config key and no
# environment equivalent.
