#
# Full inventory of environment variables the metadata-service server reads.
#
# Live entries below are either required site configuration or must match the
# container's volume layout. Everything else is commented out and shown with its
# compiled-in default: viper resolves environment variables BEFORE the config
# file, so uncommenting a line overrides /etc/metadata-service/config.yaml.
#
# Every key is also settable in config.yaml under the lowercase name minus the
# METADATA_SERVICE_ prefix (e.g. METADATA_SERVICE_PORT -> port).

[Container]

# --- Required site configuration ---
# Must be set explicitly by the site administrator or by an OpenCHAMI
# deployment meta-configuration package. The server exits at startup if
# SMD_URL is unset and --mock-smd was not passed.
Environment=METADATA_SERVICE_SMD_URL=

# --- Storage ---
# Must match the volume mount in the unit; the compiled-in default is /data,
# which is not writable by the distroless nonroot user.
Environment=METADATA_SERVICE_DATA_DIR=/app/data

# --- Server ---
#Environment=METADATA_SERVICE_PORT=8080
#Environment=METADATA_SERVICE_HOST=0.0.0.0
#Environment=METADATA_SERVICE_READ_TIMEOUT=15
#Environment=METADATA_SERVICE_WRITE_TIMEOUT=15
#Environment=METADATA_SERVICE_IDLE_TIMEOUT=60

# --- Logging / metrics ---
#Environment=METADATA_SERVICE_DEBUG=false
#Environment=METADATA_SERVICE_ENABLE_METRICS=false
#Environment=METADATA_SERVICE_METRICS_PORT=9090

# --- WireGuard ---
# WIREGUARD_SERVER is empty by default; set a CIDR (e.g. 100.97.0.1/16) to enable
# the userspace controller. Requires AddCapability=cap_net_admin and /dev/net/tun.
#Environment=METADATA_SERVICE_WIREGUARD_SERVER=
#Environment=METADATA_SERVICE_WIREGUARD_STATE_FILE=/data/wireguard/state.yaml
#Environment=METADATA_SERVICE_WIREGUARD_ONLY=false

# --- SMD ---
# SMD_TOKEN is used only when SMD_JWT is empty. Both are ignored when
# TokenSmith dynamic auth is active.
#Environment=METADATA_SERVICE_SMD_JWT=
#Environment=METADATA_SERVICE_SMD_TOKEN=
#Environment=METADATA_SERVICE_SMD_SYNC_ENABLED=true
#Environment=METADATA_SERVICE_SMD_SYNC_INTERVAL=60

# --- TokenSmith ---
# Setting TOKENSMITH_URL switches SMD auth from static token to dynamic exchange;
# config.yaml sets it by default. Cert+key select the mTLS path; the bootstrap
# token is the fallback path and is injected by the unit's Secret= directive,
# so do not set it here.
#Environment=METADATA_SERVICE_TOKENSMITH_URL=
#Environment=METADATA_SERVICE_TOKENSMITH_SERVICE_IDENTITY_CERT=
#Environment=METADATA_SERVICE_TOKENSMITH_SERVICE_IDENTITY_KEY=
#Environment=METADATA_SERVICE_TOKENSMITH_SERVICE_IDENTITY_CA=
#Environment=METADATA_SERVICE_TOKENSMITH_TARGET_SERVICE=smd
#Environment=METADATA_SERVICE_TOKENSMITH_REFRESH_SKEW_SEC=300
#Environment=METADATA_SERVICE_TOKENSMITH_BOOTSTRAP_POLICY_SCOPES_HINT=

# --config and --mock-smd are flag-only; they have no environment equivalent.
