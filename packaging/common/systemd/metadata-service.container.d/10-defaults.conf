#
# Deployment glue for metadata-service, shipped with this repo's package.
# It supplies the Podman and systemd wiring for the default deployment style;
# meta-configuration packages from the OpenCHAMI distro repositories override
# it with drop-ins for other styles (single-node, multi-node, and so on).
#
# Scope: Podman and systemd directives only - volumes, networks, secrets,
# capabilities, devices, ExecStartPre, and the like.
#
# Not for environment variables. Service configuration lives in
# /etc/openchami/configs/metadata-service.yaml, which the maintainers keep as
# the single place it is set. Set environment variables in your own drop-in
# under /etc/containers/systemd/metadata-service.container.d/ if you need them,
# but note they override the config file.

[Container]

# SECRETS
Secret=%N-bootstrap-token,type=env,target=TOKENSMITH_BOOTSTRAP_TOKEN

# VOLUMES
Volume=/etc/openchami/configs/%N.yaml:/etc/%N/config.yaml:ro,Z
Volume=metadata-service-data.volume:/app/data:rw,Z

# NETWORK
Network=openchami-internal.network
HttpProxy=false

# For WireGuard tunnel creation
AddCapability=cap_net_admin
AddDevice=/dev/net/tun

[Service]
ExecStartPre=/usr/sbin/tokensmith_bootstrap_token metadata-service
