project:
  name: cloud-init
  module: github.com/openchami/metadata
features:
  validation:
    enabled: true
    mode: strict
  events:
    enabled: true
    bus_type: memory
  conditional:
    enabled: true
    etag_algorithm: sha256
  auth:
    enabled: true
  security:
    authn:
      enabled: true
    authz:
      enabled: false
      mode: enforce
  storage:
    enabled: true
    type: file
    db_driver: sqlite3
  reconciliation:
    enabled: true
    worker_count: 5
    requeue_delay: 5
generation:
  handlers: true
  storage: true
  client: true
  openapi: true
  events: false
  middleware: true
  reconciliation: true
