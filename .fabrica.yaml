project:
  name: metadata-service
  module: github.com/openchami/metadata-service
  description: Cloud-init metadata service with Fabrica-generated REST APIs
  created: 2026-04-24T00:00:00Z
features:
  validation:
    enabled: true
    mode: strict
  events:
    enabled: true
    bus_type: memory
  conditional:
    enabled: true
    etag_algorithm: sha256
  auth:
    enabled: false
  security:
    authn:
      enabled: false
    authz:
      enabled: false
      mode: enforce
  storage:
    enabled: true
    type: file
  metrics:
    enabled: true
    provider: prometheus
generation:
  handlers: true
  storage: true
  client: true
  openapi: true
  events: true
  middleware: true
  reconciliation: false
